apiVersion: v1
kind: Pod
metadata:
  name: terminal
  labels:
    app: eumatheia
    component: terminal
spec:
  serviceAccountName: session-user
  containers:
    - name: terminal
      image: tsl0922/ttyd:alpine
      command: ["/bin/sh"]
      args:
        - -c
        - |
          # Install basic tools
          apk add --no-cache vim curl wget git bash
          # Start ttyd serving bash
          ttyd -p 7681 -W bash
      ports:
        - containerPort: 7681
          name: ttyd
          protocol: TCP
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "512Mi"
  restartPolicy: Always
