apiVersion: v1
kind: Pod
metadata:
  name: terminal
  labels:
    app: eumatheia
    component: terminal
spec:
  serviceAccountName: session-user
  containers:
    - name: terminal
      image: python:3.12-slim
      command: ["/bin/bash"]
      args:
        - -c
        - |
          # Install basic tools, Python packages, and ttyd
          apt-get update && apt-get install -y vim curl wget git
          pip install --no-cache-dir fastapi uvicorn

          # Install ttyd
          wget https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          chmod +x /usr/local/bin/ttyd

          # Start ttyd serving bash
          ttyd -p 7681 -W /bin/bash
      ports:
        - containerPort: 7681
          name: ttyd
          protocol: TCP
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "512Mi"
  restartPolicy: Always
