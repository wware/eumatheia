apiVersion: v1
kind: Pod
metadata:
  name: terminal
  labels:
    app: eumatheia
    component: terminal
spec:
  serviceAccountName: session-user
  containers:
    - name: terminal
      image: python:3.12-slim
      command: ["/bin/bash"]
      args:
        - -c
        - |
          # Install basic tools and Python packages
          apt-get update && apt-get install -y vim curl wget git
          pip install --no-cache-dir fastapi uvicorn
          # Keep container running
          sleep infinity
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "512Mi"
      tty: true
      stdin: true
  restartPolicy: Always
