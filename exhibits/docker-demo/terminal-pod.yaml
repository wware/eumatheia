apiVersion: v1
kind: Pod
metadata:
  name: terminal
  labels:
    app: eumatheia
    component: terminal
spec:
  serviceAccountName: session-user
  containers:
    - name: terminal
      image: docker:24-dind
      command: ["/bin/sh"]
      args:
        - -c
        - |
          # Start Docker daemon in background
          dockerd-entrypoint.sh &
          # Wait for Docker to start
          sleep 5
          # Install additional tools
          apk add --no-cache vim bash curl
          # Keep container running
          sleep infinity
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      securityContext:
        privileged: true  # Required for Docker-in-Docker
      tty: true
      stdin: true
  restartPolicy: Always
