apiVersion: v1
kind: Pod
metadata:
  name: terminal
  labels:
    app: eumatheia
    component: terminal
spec:
  serviceAccountName: session-user
  containers:
    - name: terminal
      image: docker:24-dind
      command: ["/bin/sh"]
      args:
        - -c
        - |
          # Start Docker daemon in background
          dockerd-entrypoint.sh &
          # Wait for Docker to start
          sleep 5
          # Install additional tools and ttyd
          apk add --no-cache vim bash curl wget git

          # Install ttyd
          wget https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -O /usr/local/bin/ttyd
          chmod +x /usr/local/bin/ttyd

          # Start ttyd serving bash
          ttyd -p 7681 -W bash
      ports:
        - containerPort: 7681
          name: ttyd
          protocol: TCP
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      securityContext:
        privileged: true  # Required for Docker-in-Docker
  restartPolicy: Always
