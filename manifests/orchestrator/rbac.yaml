apiVersion: v1
kind: ServiceAccount
metadata:
  name: eumatheia-orchestrator
  namespace: eumatheia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eumatheia-orchestrator
rules:
  # Namespace management
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
      - delete
      - watch

  # Resource management within session namespaces
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
      - watch

  # Network policies
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update

  # RBAC for session namespaces
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update

  # Deployments, StatefulSets, Jobs
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
      - watch

  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - create
      - delete
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eumatheia-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eumatheia-orchestrator
subjects:
  - kind: ServiceAccount
    name: eumatheia-orchestrator
    namespace: eumatheia-system
