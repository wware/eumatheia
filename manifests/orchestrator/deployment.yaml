apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: eumatheia-system
  labels:
    app: eumatheia
    component: orchestrator
spec:
  replicas: 1  # Single instance for now (session state is in-memory)
  selector:
    matchLabels:
      app: eumatheia
      component: orchestrator
  template:
    metadata:
      labels:
        app: eumatheia
        component: orchestrator
    spec:
      serviceAccountName: eumatheia-orchestrator
      containers:
        - name: orchestrator
          image: eumatheia-orchestrator:latest
          imagePullPolicy: Never  # For kind with local images
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: eumatheia-system
  labels:
    app: eumatheia
    component: orchestrator
spec:
  type: NodePort  # NodePort for kind cluster access from host
  selector:
    app: eumatheia
    component: orchestrator
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800  # Fixed port for easy access
