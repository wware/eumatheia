apiVersion: v1
kind: ServiceAccount
metadata:
  name: session-user
  # namespace will be set programmatically to sess-{session_id}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: session-role
  # namespace will be set programmatically to sess-{session_id}
rules:
  # Allow read access to most resources in the namespace
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch

  # Allow pod management (create, delete) for learning scenarios
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - create
      - delete
      - patch
      - update

  # Allow service management
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - create
      - delete
      - patch
      - update

  # Allow deployment management (if needed for k8s tutorials)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - patch
      - update

  # Allow exec into pods (for verification and debugging)
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get

  # Deny access to namespace itself and RBAC resources
  # (these are implicitly denied by not being listed above)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: session-rolebinding
  # namespace will be set programmatically to sess-{session_id}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: session-role
subjects:
  - kind: ServiceAccount
    name: session-user
