apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: session-isolation
  # namespace will be set programmatically to sess-{session_id}
spec:
  # Apply to all pods in the namespace
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress

  # Ingress rules - allow traffic within the same namespace
  ingress:
    - from:
        # Allow from pods in the same namespace
        - podSelector: {}

  # Egress rules
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53

    # Allow traffic within the same namespace
    - to:
        - podSelector: {}

    # Allow egress to external services (internet)
    # Remove or restrict these rules if you want to prevent outbound abuse
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443

    # Allow all egress for now - can be restricted later if needed
    - to:
        - namespaceSelector: {}
        - podSelector: {}
